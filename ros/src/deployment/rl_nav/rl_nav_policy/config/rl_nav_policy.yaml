/**:
  ros__parameters:
    # Empty uses the packaged policy/817.onnx selected by the node.
    policy_path: ""
    cloud_topic: /navigation/lidar/points
    odom_topic: /lio/robo/odom
    goal_topic: /goal_pose
    cmd_vel_topic: /cmd_vel
    body_vel_cmd_topic: /motion/body_vel_cmd
    body_vel_cmd_hz: 50.0
    # Physical scale applied only to BodyVelCmd. /cmd_vel stays normalized.
    body_vel_scale: [0.7, 0.4, 0.7]
    joystick_cmd_vel_topic: /cmd_vel_joystick

    # Hardware GamepadKeys on /hardware/gamepad_keys.
    # BACK+X selects joystick, BACK+Y navigation. Indices differ from /joy:
    # /joy MODE=6 X=2 Y=3 vs GamepadKeys BACK=6 X=4 Y=5.
    # The same gate is also exposed as /rl_nav_policy/set_policy_enabled.
    gamepad_type: gamepad_keys
    gamepad_topic: /hardware/gamepad_keys
    mode_button: 6
    disable_button: 4
    enable_button: 5
    initial_policy_enabled: false

    policy_hz: 5.0
    input_timeout: 0.5
    goal_tolerance: 0.5

    ray_origin: [0.105, 0.0, 0.185]
    max_distance: 5.0
    action_filter_alpha: 0.8819113783
    velocity_filter_alpha: 0.8
    velocity_max_dt: 0.5

    # By default the robot stays stopped until a PoseStamped arrives.
    initial_goal_enabled: false
    initial_goal_x: 0.0
    initial_goal_y: 0.0
    initial_goal_z: 0.5
